<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Policies approval</title>
<style>
body { margin:0; font-family: system-ui, sans-serif; background:#111827; color:#fff; }
.wrap { max-width:420px; margin:0 auto; padding:16px; }
.card { background:#1f2a3a; border:1.5px solid #c9a86a; border-radius:14px; padding:14px; margin-top:12px; }
h1 { font-size:17px; font-weight:500; text-align:center; letter-spacing:1px; }
h2 { font-size:15px; font-weight:500; margin:0 0 6px; }
ul { margin:0; padding-left:18px; font-size:13px; color:#cfd8e3; line-height:1.7; }
.row { display:flex; gap:8px; margin-top:10px; }
.btn { flex:1; background:#1e3a6e; color:#fff; border:1px solid #c9a86a; border-radius:999px; padding:9px; font-size:13px; cursor:pointer; }
.btn.no { background:transparent; }
.status { font-size:12px; margin-top:8px; color:#cfd8e3; }
.ok { color:#9be7a6; } .bad { color:#f8a5a5; }
</style>
</head>
<body>
<div class="wrap">
  <h1>POLICIES APPROVAL</h1>
  <p style="font-size:12px;color:#cfd8e3;text-align:center">Har role ke rules check karein. Approve ya reject karein, phir main SQL apply karunga.</p>
  <div id="list"></div>
  <div class="card">
    <div class="status" id="summary">Abhi koi decision nahi.</div>
  </div>
</div>
<script>
const POLICIES = [
  { role: "Anon (bina login)", rules: ["Kisi bhi table ka access nahi"] },
  { role: "Admin", rules: ["Sab tables par poora access (dekhna, add, edit, delete)", "Shop approval, reset approval, token approval, payment verify"] },
  { role: "User", rules: ["Shopkeeper ke orders dekh aur approve kar sakta hai", "Outlets assign kar sakta hai", "Employer aur Order Booker ki ID bana sakta hai"] },
  { role: "Employer", rules: ["Shopkeeper ke approved orders dekh sakta hai", "Dispatch aur printing kar sakta hai, status update kar sakta hai"] },
  { role: "Order Booker", rules: ["Sirf apne assigned outlets aur apne orders dekh sakta hai", "Apni attendance aur KPIs dekh sakta hai"] },
  { role: "Shopkeeper", rules: ["Sirf apni shop, apne orders, tokens aur payments dekh sakta hai"] },
  { role: "Public read", rules: ["Products aur packs sabko dikh sakte hain (sirf read)"] }
];
const decisions = {};
const list = document.getElementById("list");
POLICIES.forEach((p, i) => {
  const c = document.createElement("div");
  c.className = "card";
  const h = document.createElement("h2");
  h.textContent = p.role;
  c.appendChild(h);
  const ul = document.createElement("ul");
  p.rules.forEach(r => { const li = document.createElement("li"); li.textContent = r; ul.appendChild(li); });
  c.appendChild(ul);
  const row = document.createElement("div");
  row.className = "row";
  const st = document.createElement("div");
  st.className = "status";
  st.textContent = "Pending";
  const ok = document.createElement("button");
  ok.className = "btn"; ok.textContent = "Approve";
  const no = document.createElement("button");
  no.className = "btn no"; no.textContent = "Reject";
  ok.onclick = () => { decisions[i] = "approved"; st.textContent = "Approved"; st.className = "status ok"; update(); };
  no.onclick = () => { decisions[i] = "rejected"; st.textContent = "Rejected, badlav batayein"; st.className = "status bad"; update(); };
  row.appendChild(ok); row.appendChild(no);
  c.appendChild(row);
  c.appendChild(st);
  list.appendChild(c);
});
function update() {
  const total = POLICIES.length;
  const approved = Object.values(decisions).filter(v => v === "approved").length;
  const rejected = Object.values(decisions).filter(v => v === "rejected").length;
  document.getElementById("summary").textContent = "Approved: " + approved + " / " + total + " | Rejected: " + rejected;
}
</script>
</body>
</html>
